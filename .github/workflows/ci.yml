name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SITE_URL: https://eduindev.com

# A push that lands while a deploy is running should supersede it, not race it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          VITE_SITE_URL: ${{ env.SITE_URL }}

  image:
    name: Production image builds
    runs-on: self-hosted
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Not pushed — this only proves the deploy image still builds, so a broken
      # Dockerfile is caught on the PR rather than on the deploy.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          build-args: |
            VITE_SITE_URL=${{ env.SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Build image and deploy
    runs-on: self-hosted
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          # VITE_SITE_URL is baked into the client bundle at build time — it
          # feeds the canonical links, Open Graph tags and the sitemap.
          build-args: |
            VITE_SITE_URL=${{ env.SITE_URL }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/portfolio:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/portfolio:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to eduindev.com
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/portfolio:sha-${{ github.sha }}
        run: |
          set -euo pipefail

          # The runner image has docker and git but no ssh client, so the deploy
          # runs from a throwaway container.
          #
          # The private key goes in on stdin rather than as a bind mount or an
          # env var: a bind mount would resolve against the docker host rather
          # than this container, and an env var stays readable through
          # `docker inspect` for the life of the container.
          #
          # The key on the server is pinned to a forced command that accepts
          # only an image reference, so this is the whole deploy surface.
          printf '%s\n' "$DEPLOY_KEY" | docker run --rm -i \
            -e DEPLOY_HOST -e DEPLOY_USER -e DEPLOY_HOST_KEY -e IMAGE \
            alpine:3.22 sh -euc '
              apk add --no-cache openssh-client >/dev/null
              mkdir -p /root/.ssh && chmod 700 /root/.ssh
              cat > /root/.ssh/id && chmod 600 /root/.ssh/id
              printf "%s\n" "$DEPLOY_HOST_KEY" > /root/.ssh/known_hosts
              exec ssh -n -i /root/.ssh/id -o IdentitiesOnly=yes \
                -o UserKnownHostsFile=/root/.ssh/known_hosts \
                -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
                "$DEPLOY_USER@$DEPLOY_HOST" "$IMAGE"
            '

      - name: Smoke test
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${SITE_URL}/robots.txt" || true)"
            [ "$code" = "200" ] && { echo "site is up"; exit 0; }
            echo "attempt $i: got $code"; sleep 5
          done
          echo "site did not come back up" >&2
          exit 1
